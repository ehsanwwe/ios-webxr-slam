<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>WebARKit — Basic placement</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family:
          -apple-system, system-ui, BlinkMacSystemFont, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        background: rgba(0, 0, 0, 0.88);
      }
      #start button {
        font-size: 18px;
        padding: 14px 28px;
        border-radius: 12px;
        border: 0;
        background: #2ea1ff;
        color: #fff;
        font-weight: 600;
      }
      #log {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 50;
        font-size: 12px;
        line-height: 1.4;
        opacity: 0.85;
        pointer-events: none;
        white-space: pre-wrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="start"><button id="start-btn">Start AR</button></div>
    <div id="log"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
